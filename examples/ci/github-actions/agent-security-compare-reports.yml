name: Agent Security Report Comparison

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compare-reports:
    name: Compare stored config-risk reports
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare previous and current reports
        run: |
          python3 skills/agent-security/scripts/config_risk_summary.py \
            --compare-reports \
            path/to/before-report.json \
            path/to/after-report.json \
            --fail-on-new
